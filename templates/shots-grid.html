<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: up to 3 pages of 6 shots (2 cols × 3 rows on phone, 3 × 2 on wide screens), swipe between pages. Picture + title, one line only where there's an action. One typeface, neutral greys, the photos carry the colour. */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --ink:#141414; --muted:#6E6E6A; --line:#E2E2DE; --focus:#141414;
  --sans:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111111;--surface:#1A1A1A;--ink:#EDEDEA;--muted:#9A9A95;--line:#2A2A28;--focus:#EDEDEA}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111111;--surface:#1A1A1A;--ink:#EDEDEA;--muted:#9A9A95;--line:#2A2A28;--focus:#EDEDEA}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:680px;margin:0 auto;display:grid;gap:20px}
header{display:grid;gap:4px}
h1{font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;letter-spacing:-.02em}
.sub{font-size:14px;color:var(--muted)}
.pages{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:16px;min-width:0}
.pages::-webkit-scrollbar{display:none}
.page{scroll-snap-align:start;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;align-content:start;min-width:0}
@media (min-width:720px){.page{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 16px}}
figure{margin:0;display:grid;gap:8px;align-content:start;min-width:0}
figure img{width:100%;max-width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px;display:block;background:var(--line)}
figcaption{display:grid;gap:2px}
figcaption b{font-weight:500;font-size:14.5px;line-height:1.3;letter-spacing:-.005em}
figcaption p{margin:0;font-size:13px;line-height:1.4;color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.pager button{font:500 14px/1 var(--sans);color:var(--ink);background:none;border:0;padding:8px 2px;cursor:pointer}
.pager button:disabled{color:var(--muted);opacity:.5;cursor:default}
.pager button:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.pager span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>

<div class="wrap">
  <header><h1>__TITLE__</h1><span class="sub">__SUB__</span></header>
  <div class="pager"><button type="button" id="prev">← Prev</button><span id="pos">Page 1 of __NP__</span><button type="button" id="next">Next →</button></div>
  <div class="pages" id="pages">__PAGES__</div>
</div>

<script>
const el=document.getElementById("pages"), n=el.children.length;
const prev=document.getElementById("prev"), next=document.getElementById("next"), pos=document.getElementById("pos");
const cur=()=>Math.round(el.scrollLeft/(el.clientWidth+16));
function upd(){const i=cur();pos.textContent=`Page ${i+1} of ${n}`;prev.disabled=i===0;next.disabled=i===n-1;}
function go(d){const i=Math.min(n-1,Math.max(0,cur()+d));el.scrollTo({left:i*(el.clientWidth+16),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
prev.onclick=()=>go(-1); next.onclick=()=>go(1);
el.addEventListener("scroll",()=>requestAnimationFrame(upd),{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);});
upd();
</script>

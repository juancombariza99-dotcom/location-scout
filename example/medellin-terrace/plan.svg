        <text class="lbl" x="36" y="204">← leaf art + "Sigue tus sueños"</text>
        <rect class="furn" x="40" y="232" width="110" height="24"/>
        <text class="lbl-ink" x="68" y="248">wardrobe</text>
        <line x1="160" y1="258" x2="195" y2="258" stroke="var(--bg)" stroke-width="5"/>
        <text class="lbl" x="164" y="274">bath</text>
        <text class="lbl" x="206" y="250">wood-beam roof</text>
        <!-- desk nook -->
        <line x1="201" y1="44" x2="201" y2="86" stroke="var(--cam)" stroke-width="4"/>
        <rect class="glass" x="214" y="27" width="66" height="6"/>
        <text class="lbl" x="212" y="22">desk window</text>
        <rect class="furn" x="210" y="34" width="80" height="20"/>
        <text class="lbl-ink" x="236" y="48">desk</text>
        <circle class="furn" cx="250" cy="66" r="8"/>
        <rect class="furn" x="296" y="32" width="12" height="26"/>
        <!-- armchairs -->
        <rect class="furn" x="282" y="110" width="30" height="30" rx="4"/>
        <rect class="furn" x="282" y="152" width="30" height="30" rx="4"/>
        <text class="lbl" x="268" y="198">armchairs</text>
        <!-- living -->
        <rect class="glass" x="368" y="27" width="156" height="6"/>
        <text class="lbl" x="370" y="22">sofa windows · mountains</text>
        <rect class="furn" x="380" y="34" width="124" height="30" rx="6"/>
        <text class="lbl-ink" x="430" y="53">sofa</text>
        <rect class="furn" x="516" y="36" width="18" height="18"/>
        <circle class="furn" cx="430" cy="92" r="12"/><circle class="furn" cx="454" cy="99" r="10"/>
        <rect class="glass" x="556" y="44" width="8" height="140"/>
        <text class="lbl" x="576" y="70" transform="rotate(90 576 70)">GLASS DOORS</text>
        <ellipse class="rug" cx="538" cy="122" rx="12" ry="9"/>
        <!-- TV -->
        <rect class="soft" x="330" y="214" width="64" height="14"/>
        <text class="lbl" x="330" y="244">TV · cabinet</text>
        <!-- kitchen + entry -->
        <rect class="dash" x="404" y="198" width="152" height="58"/>
        <rect class="furn" x="404" y="198" width="120" height="8"/>
        <circle class="furn" cx="436" cy="186" r="7"/><circle class="furn" cx="466" cy="186" r="7"/>
        <text class="lbl" x="476" y="190">bar</text>
        <rect class="furn" x="404" y="206" width="120" height="18"/>
        <text class="lbl-ink" x="410" y="219">galley · sink · hob</text>
        <rect class="furn" x="482" y="234" width="26" height="22"/>
        <text class="lbl" x="420" y="250">fridge →</text>
        <rect class="glass" x="556" y="208" width="6" height="22"/>
        <line x1="518" y1="258" x2="548" y2="258" stroke="var(--bg)" stroke-width="5"/>
        <text class="lbl-ink" x="516" y="274">ENTRY</text>
        <!-- scale -->
        <g transform="translate(30 290)"><line class="thin" x1="0" y1="0" x2="40" y2="0"/><line class="thin" x1="0" y1="-3" x2="0" y2="3"/><line class="thin" x1="40" y1="-3" x2="40" y2="3"/><text class="lbl" x="46" y="4">1 m (rough)</text></g>
        <!-- camera spots -->
        <a href="#spot-A" aria-label="Spot A, galley pass"><path class="cone" d="M500 236 L362 124 L412 104 Z"/><circle class="camdot" cx="500" cy="236" r="11"/><text class="camtxt" x="496.5" y="239.5">A</text></a>
        <a href="#spot-B" aria-label="Spot B, two chairs and glass doors"><path class="cone" d="M240 150 L410 76 L410 214 Z"/><circle class="camdot" cx="240" cy="150" r="11"/><text class="camtxt" x="236.5" y="153.5">B</text></a>
        <a href="#spot-C" aria-label="Spot C, the terrace"><path class="cone" d="M598 64 L572 202 L676 202 Z"/><circle class="camdot" cx="598" cy="64" r="11"/><text class="camtxt" x="594.5" y="67.5">C</text></a>
        <a href="#spot-D" aria-label="Spot D, sofa window"><path class="cone" d="M442 168 L378 40 L506 40 Z"/><circle class="camdot" cx="442" cy="168" r="11"/><text class="camtxt" x="438.5" y="171.5">D</text></a>
        <a href="#spot-E" aria-label="Spot E, desk nook"><path class="cone" d="M250 104 L212 36 L288 36 Z"/><circle class="camdot" cx="250" cy="104" r="11"/><text class="camtxt" x="246.5" y="107.5">E</text></a>
        <a href="#spot-F" aria-label="Spot F, bed under the beams"><path class="cone" d="M176 148 L36 110 L36 186 Z"/><circle class="camdot" cx="176" cy="148" r="11"/><text class="camtxt" x="172.5" y="151.5">F</text></a>
      </svg>
<svg viewBox="0 0 710 300" role="img" aria-label="Floor plan: bedroom and desk under a wooden roof on the left, living room with sofa and armchairs in the middle, kitchen and entry bottom right, glass doors to a brick terrace on the right" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <!-- wood roof zone -->
        <rect class="wood" x="32" y="32" width="268" height="224"/>
        <!-- terrace -->
        <rect class="terr" x="566" y="30" width="114" height="180"/>
        <path class="parapet" d="M566 30 H680 V210"/>
        <line x1="566" y1="210" x2="680" y2="210" stroke="var(--brick)" stroke-width="7"/>
        <text class="big" x="590" y="48">TERRACE</text>
        <text class="lbl" x="694" y="64" transform="rotate(90 694 64)">brick parapet · mountain view</text>
        <rect class="furn" x="612" y="146" width="34" height="34"/>
        <circle class="furn" cx="603" cy="155" r="6"/><circle class="furn" cx="655" cy="155" r="6"/><circle class="furn" cx="603" cy="173" r="6"/><circle class="furn" cx="655" cy="173" r="6"/>
        <circle cx="629" cy="206" r="3.5" fill="var(--cam)"/>
        <text class="lbl" x="606" y="228">wall lamp</text>
        <!-- walls -->
        <rect class="wall" x="30" y="30" width="530" height="228"/>
        <line class="wall" x1="198" y1="30" x2="198" y2="96"/>
        <!-- bedroom -->
        <line x1="31" y1="120" x2="31" y2="176" stroke="var(--cam)" stroke-width="4"/>
        <rect class="furn" x="34" y="112" width="84" height="70" rx="3"/>
        <text class="lbl-ink" x="64" y="151">bed</text>
        <rect class="furn" x="36" y="92" width="22" height="16"/>
        <rect class="glass" x="70" y="27" width="60" height="6"/>
